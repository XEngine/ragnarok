name: Bug report
description: Help reproduce a problem with the alpha.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Game and mod setup
      description: Valheim/Ironbound versions, other mods, HUD style, local or dedicated server, fresh launch or F6 reload.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual result
      description: Include the exact message. For mount bugs, include loaded/distant, hunger, rider and combat state.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Relevant BepInEx/LogOutput.log excerpt or attachment; remove private connection details first.
